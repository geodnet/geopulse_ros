# =============================================================================
# Docker Compose for Geodnet ROS2 NMEA NavSat Driver
# =============================================================================
# Usage:
#   docker compose up
#   SERIAL_DEVICE=/dev/ttyACM0 docker compose up
# =============================================================================

services:
  nmea-driver:
    image: geodnet-nmea-driver:latest
    command: ros2 launch nmea_navsat_driver nmea_serial_driver.launch.py
    devices:
      - "${SERIAL_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    network_mode: host
    restart: unless-stopped
