[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geodnet_ros_driver"
version = "2.0.1"
description = "Package to parse NMEA strings and publish a very simple GPS message."
readme = "README.rst"
license = { text = "BSD" }
maintainers = [{ name = "Nithya Srinivasan", email = "nithya@geodnet.com" }]
keywords = ["ROS2", "NMEA", "GPS", "GNSS", "NavSat"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.8"
dependencies = ["setuptools", "pyserial", "numpy", "pyyaml"]
